name: Reading Tools Native

on:
  pull_request:
    paths:
      - ".github/workflows/reading-tools-native.yml"
      - "extensions/reading-tools-native/**"
      - "sdk/swift/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/reading-tools-native.yml"
      - "extensions/reading-tools-native/**"
      - "sdk/swift/**"

concurrency:
  group: reading-tools-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build Reading Tools
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test Reading Tools package
        run: swift test --package-path extensions/reading-tools-native

      - name: Build installable package
        run: zsh extensions/reading-tools-native/build.sh

      - name: Validate package
        run: |
          swift run --package-path sdk/swift vehla-swift validate \
            extensions/reading-tools-native/dist/ReadingTools
