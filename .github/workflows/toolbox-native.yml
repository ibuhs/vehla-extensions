name: Toolbox Native

on:
  pull_request:
    paths:
      - ".github/workflows/toolbox-native.yml"
      - "extensions/toolbox-native/**"
      - "sdk/swift/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/toolbox-native.yml"
      - "extensions/toolbox-native/**"
      - "sdk/swift/**"

concurrency:
  group: toolbox-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build Toolbox
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test Toolbox package
        run: swift test --package-path extensions/toolbox-native

      - name: Build installable package
        run: zsh extensions/toolbox-native/build.sh

      - name: Validate package
        run: |
          swift run --package-path sdk/swift vehla-swift validate \
            extensions/toolbox-native/dist/Toolbox
