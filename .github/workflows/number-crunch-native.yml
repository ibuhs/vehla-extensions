name: Number Crunch Native

on:
  pull_request:
    paths:
      - ".github/workflows/number-crunch-native.yml"
      - "extensions/number-crunch-native/**"
      - "sdk/swift/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/number-crunch-native.yml"
      - "extensions/number-crunch-native/**"
      - "sdk/swift/**"

concurrency:
  group: number-crunch-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build Number Crunch
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test Number Crunch package
        run: swift test --package-path extensions/number-crunch-native

      - name: Build installable package
        run: zsh extensions/number-crunch-native/build.sh

      - name: Validate package
        run: |
          swift run --package-path sdk/swift vehla-swift validate \
            extensions/number-crunch-native/dist/NumberCrunch
