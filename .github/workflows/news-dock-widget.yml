name: News Dock Widget

on:
  pull_request:
    paths:
      - ".github/workflows/news-dock-widget.yml"
      - "extensions/news-dock-widget/**"
      - "sdk/swift/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/news-dock-widget.yml"
      - "extensions/news-dock-widget/**"
      - "sdk/swift/**"

concurrency:
  group: news-dock-widget-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate News
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build widget bundle
        run: zsh extensions/news-dock-widget/build.sh

      - name: Validate widget package
        run: |
          swift run --package-path sdk/swift vehla-swift validate \
            extensions/news-dock-widget
