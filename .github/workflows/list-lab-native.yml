name: List Lab Native

on:
  pull_request:
    paths:
      - ".github/workflows/list-lab-native.yml"
      - "extensions/list-lab-native/**"
      - "sdk/swift/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/list-lab-native.yml"
      - "extensions/list-lab-native/**"
      - "sdk/swift/**"

concurrency:
  group: list-lab-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build List Lab
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test List Lab package
        run: swift test --package-path extensions/list-lab-native

      - name: Build installable package
        run: zsh extensions/list-lab-native/build.sh

      - name: Validate package
        run: |
          swift run --package-path sdk/swift vehla-swift validate \
            extensions/list-lab-native/dist/ListLab
