name: Link Lens Native

on:
  pull_request:
    paths:
      - ".github/workflows/link-lens-native.yml"
      - "extensions/link-lens-native/**"
      - "sdk/swift/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/link-lens-native.yml"
      - "extensions/link-lens-native/**"
      - "sdk/swift/**"

concurrency:
  group: link-lens-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build Link Lens
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test Link Lens package
        run: swift test --package-path extensions/link-lens-native

      - name: Build installable package
        run: zsh extensions/link-lens-native/build.sh

      - name: Validate package
        run: |
          swift run --package-path sdk/swift vehla-swift validate \
            extensions/link-lens-native/dist/LinkLens
